    Summary:
      - |
        I am a postdoctoral researcher at CAR-CSIC/UPM and hold a PhD in Automation and Robotics from UPM (Sobresaliente *cum laude*), specializing in exact combinatorial algorithms for robust 3D perception and their application in social robotics. During my doctoral research at CAR-CSIC/UPM (FPI fellowship), I developed CliReg, a state-of-the-art graph-theoretic solver for rigid point cloud registration, and engineered Ray, a custom-built social robotic platform with a distributed dual-layer middleware (micro-RayOS/RayOS) for safe, perception-driven interaction. My profile bridges rigorous mathematical optimization with robust systems engineering, backed by my industry background as a Site Reliability Engineer. Proven track record in both theoretical research (SLAM, perception) and mentoring, having directed 9 academic theses.

