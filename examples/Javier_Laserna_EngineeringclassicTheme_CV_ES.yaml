    Perfil Profesional:
      - |
        Soy investigador postdoctoral en el CAR-CSIC/UPM y Doctor en Automática y Robótica por la UPM (Sobresaliente *cum laude*), especializado en algoritmos combinatorios exactos para la percepción 3D robusta y su aplicación en robótica social. Durante mi doctorado en el CAR-CSIC/UPM (contrato FPI) desarrollé CliReg, un solver de última generación basado en teoría de grafos para el registro rígido de nubes de puntos. Asimismo, diseñé y construí Ray, una plataforma robótica social a medida que cuenta con un middleware distribuido de doble capa (micro-RayOS/RayOS) para lograr una interacción segura y guiada por la percepción. Mi perfil combina la optimización matemática con una sólida ingeniería de sistemas, todo ello respaldado por mi experiencia previa en la industria como Site Reliability Engineer. Cuento con una trayectoria demostrada tanto en la investigación teórica (SLAM, percepción) como en la docencia, habiendo codirigido 9 trabajos académicos (TFGs/TFMs).

